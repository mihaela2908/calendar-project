<!DOCTYPE html>
<html lang="ro">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Calendar Configurabil</title>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      background: white;
      padding: 20px;
      margin: 0;
    }

    .calendar-container {
      background: white;
      padding: 20px;
      max-width: 320px;
      width: 100%;
      border: 1px solid #e5e5e5;
      border-radius: 8px;
      margin: 0;
    }

    .calendar-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 20px;
    }

    .month-year {
      font-size: 22px;
      font-weight: 600;
      color: #333;
    }

    .nav-buttons {
      display: flex;
      gap: 15px;
    }

    .nav-btn {
      background: none;
      border: none;
      width: 24px;
      height: 24px;
      display: flex;
      align-items: center;
      justify-content: center;
      cursor: pointer;
      font-size: 20px;
      color: #999;
    }

    .nav-btn:hover {
      color: #666;
    }

    .calendar-grid {
      display: grid;
      grid-template-columns: repeat(7, 1fr);
      gap: 0;
    }

    .day-header {
      text-align: center;
      font-weight: 500;
      color: #888;
      padding: 12px 4px;
      font-size: 14px;
      position: relative;
    }

    .day-header.current-day-header {
      color: #4a7c59;
      font-weight: 600;
    }

    .day-header.current-day-header::after {
      content: '';
      position: absolute;
      bottom: 8px;
      left: 50%;
      transform: translateX(-50%);
      width: 20px;
      height: 2px;
      background-color: #4a7c59;
      border-radius: 1px;
    }

    .day-cell {
      aspect-ratio: 1;
      display: flex;
      align-items: center;
      justify-content: center;
      cursor: pointer;
      font-size: 16px;
      font-weight: 400;
      background: white;
      color: #333;
    }

    .day-cell:hover {
      background: #f8f8f8;
    }

    .day-cell.working-day-active {
      background: #90c695;
      color: white;
      border-radius: 8px;
      margin: 2px;
    }

    .day-cell.working-day-active:hover {
      background: #7fb584;
    }

    .day-cell.current-day {
      background: #4a7c59 !important;
      color: white !important;
      font-weight: 600;
      border-radius: 8px;
      margin: 2px;
    }

    .day-cell.other-month {
      color: #ddd;
      background: white;
    }

    .day-cell.selected {
      background: #90c695 !important;
      color: white !important;
      border-radius: 8px;
      margin: 2px;
    }

    .day-cell.single-day-selected {
      background: #90c695 !important;
      color: white !important;
      border-radius: 8px;
      margin: 2px;
    }

    @media (max-width: 480px) {
      .calendar-container {
        padding: 15px;
        margin: 10px;
        max-width: 300px;
      }

      .month-year {
        font-size: 20px;
      }

      .day-cell {
        font-size: 14px;
      }
    }
  </style>
</head>
<body>
<div class="calendar-container">
  <div class="calendar-header">
    <div class="month-year" id="monthYear"></div>
    <div class="nav-buttons">
      <button class="nav-btn" id="prevBtn">‹</button>
      <button class="nav-btn" id="nextBtn">›</button>
    </div>
  </div>

  <div class="calendar-grid" id="calendar">
    <!-- Calendar will be generated here -->
  </div>
</div>

<script>
  class ConfigurableCalendar {
    constructor(workWeekType = 'monday-friday') {
      this.currentDate = new Date();
      this.today = new Date();
      this.monthNames = [
        'Ianuarie', 'Februarie', 'Martie', 'Aprilie', 'Mai', 'Iunie',
        'Iulie', 'August', 'Septembrie', 'Octombrie', 'Noiembrie', 'Decembrie'
      ];
      this.dayNames = ['Lu', 'Ma', 'Mi', 'Jo', 'Vi', 'Sâ', 'Du'];

      // Doar 2 configurări disponibile
      this.workWeekConfigs = {
        'monday-friday': [1, 2, 3, 4, 5],     // Luni-Vineri
        'tuesday-saturday': [2, 3, 4, 5, 6]   // Marți-Sâmbătă
      };

      // Setează configurarea inițială
      this.setWorkWeek(workWeekType);
      this.init();
    }

    init() {
      this.render();
      this.attachEventListeners();
    }

    attachEventListeners() {
      document.getElementById('prevBtn').addEventListener('click', () => {
        this.currentDate.setMonth(this.currentDate.getMonth() - 1);
        this.render();
      });

      document.getElementById('nextBtn').addEventListener('click', () => {
        this.currentDate.setMonth(this.currentDate.getMonth() + 1);
        this.render();
      });
    }

    // Metodă publică pentru a schimba tipul săptămânii lucrătoare
    setWorkWeek(workWeekType) {
      if (!this.workWeekConfigs[workWeekType]) {
        console.warn(`Tip săptămână lucrătoare necunoscut: ${workWeekType}. Se folosește 'monday-friday'.`);
        workWeekType = 'monday-friday';
      }

      this.currentWorkWeek = workWeekType;
      this.workingDays = this.workWeekConfigs[workWeekType];

      // Re-render dacă calendarul există deja
      if (document.getElementById('calendar')) {
        this.render();
      }
    }

    // Metodă pentru a obține configurația curentă
    getWorkWeekType() {
      return this.currentWorkWeek;
    }

    // Metodă pentru a obține zilele lucrătoare
    getWorkingDays() {
      return [...this.workingDays]; // returnează o copie
    }

    isWorkingDay(dayOfWeek) {
      return this.workingDays.includes(dayOfWeek);
    }

    isToday(date) {
      return date.getDate() === this.today.getDate() &&
        date.getMonth() === this.today.getMonth() &&
        date.getFullYear() === this.today.getFullYear();
    }

    render() {
      this.renderHeader();
      this.renderCalendar();
    }

    renderHeader() {
      const monthYear = document.getElementById('monthYear');
      monthYear.textContent = `${this.monthNames[this.currentDate.getMonth()]} ${this.currentDate.getFullYear()}`;
    }

    renderCalendar() {
      const calendar = document.getElementById('calendar');
      calendar.innerHTML = '';

      // Render day headers
      this.dayNames.forEach((day, index) => {
        const dayHeader = document.createElement('div');
        dayHeader.className = 'day-header';
        dayHeader.textContent = day;

        // Highlight current day header
        const todayDayOfWeek = this.today.getDay();
        const adjustedTodayDayOfWeek = todayDayOfWeek === 0 ? 6 : todayDayOfWeek - 1;
        if (index === adjustedTodayDayOfWeek) {
          dayHeader.classList.add('current-day-header');
        }

        calendar.appendChild(dayHeader);
      });

      const year = this.currentDate.getFullYear();
      const month = this.currentDate.getMonth();

      const firstDay = new Date(year, month, 1);
      const lastDay = new Date(year, month + 1, 0);

      // Get first day of week (adjusted for Monday start)
      let startingDayOfWeek = firstDay.getDay();
      startingDayOfWeek = startingDayOfWeek === 0 ? 6 : startingDayOfWeek - 1;

      // Previous month days
      const prevMonthLastDay = new Date(year, month, 0).getDate();
      for (let i = startingDayOfWeek - 1; i >= 0; i--) {
        const dayNum = prevMonthLastDay - i;
        const date = new Date(year, month - 1, dayNum);
        this.createDayCell(dayNum, date, true);
      }

      // Current month days
      const daysInMonth = lastDay.getDate();
      for (let day = 1; day <= daysInMonth; day++) {
        const date = new Date(year, month, day);
        this.createDayCell(day, date, false);
      }

      // Next month days (to fill the grid)
      const totalCells = calendar.children.length - 7; // Subtract day headers
      const remainingCells = 42 - totalCells;
      for (let day = 1; day <= remainingCells; day++) {
        const date = new Date(year, month + 1, day);
        this.createDayCell(day, date, true);
      }
    }

    createDayCell(dayNum, date, isOtherMonth) {
      const calendar = document.getElementById('calendar');
      const dayCell = document.createElement('div');
      dayCell.className = 'day-cell';
      dayCell.textContent = dayNum;

      // Use standard JavaScript day of week (0=Sunday, 1=Monday, etc.)
      const dayOfWeek = date.getDay();

      dayCell.dataset.date = date.toISOString();
      dayCell.dataset.dayOfWeek = dayOfWeek;
      dayCell.dataset.isWorkingDay = this.isWorkingDay(dayOfWeek);

      if (isOtherMonth) {
        dayCell.classList.add('other-month');
      } else {
        if (this.isToday(date)) {
          dayCell.classList.add('current-day');
        }
      }

      // Add click event only for current month days
      if (!isOtherMonth) {
        dayCell.addEventListener('click', () => {
          if (this.isWorkingDay(dayOfWeek)) {
            // Working day - select entire working week
            this.selectWorkingWeek(date);
          } else {
            // Non-working day - select only this day
            this.selectSingleDay(dayCell);
          }
        });
      }

      calendar.appendChild(dayCell);
    }

    clearAllSelections() {
      document.querySelectorAll('.day-cell').forEach(cell => {
        cell.classList.remove('selected', 'working-day-active', 'single-day-selected');
      });
    }

    selectSingleDay(dayCell) {
      this.clearAllSelections();
      dayCell.classList.add('single-day-selected');

      // Console log pentru selecția unei zile individuale
      const date = new Date(dayCell.dataset.date);
      console.log('📅 Zi individuală selectată:', {
        data: date.toLocaleDateString('ro-RO'),
        ziSaptamana: this.dayNames[date.getDay() === 0 ? 6 : date.getDay() - 1],
        timestamp: dayCell.dataset.date
      });
    }

    selectWorkingWeek(selectedDate) {
      this.clearAllSelections();

      // Find the Monday of the week containing selectedDate
      const selectedDay = new Date(selectedDate);
      const dayOfWeek = selectedDay.getDay();
      const mondayOffset = dayOfWeek === 0 ? -6 : 1 - dayOfWeek;
      const weekStart = new Date(selectedDay);
      weekStart.setDate(selectedDay.getDate() + mondayOffset);

      const workingDaysSelected = [];

      // Go through all 7 days of the week
      for (let i = 0; i < 7; i++) {
        const currentDay = new Date(weekStart);
        currentDay.setDate(weekStart.getDate() + i);
        const currentDayOfWeek = currentDay.getDay();

        // Find the corresponding cell in the calendar
        const cells = document.querySelectorAll('.day-cell');
        cells.forEach(cell => {
          if (cell.dataset.date) {
            const cellDate = new Date(cell.dataset.date);
            if (cellDate.getDate() === currentDay.getDate() &&
              cellDate.getMonth() === currentDay.getMonth() &&
              cellDate.getFullYear() === currentDay.getFullYear()) {

              // Only highlight working days and not other-month days
              if (this.isWorkingDay(currentDayOfWeek) && !cell.classList.contains('other-month')) {
                cell.classList.add('working-day-active');
                // Adaugă în lista pentru console log
                workingDaysSelected.push({
                  data: cellDate.toLocaleDateString('ro-RO'),
                  ziSaptamana: this.dayNames[currentDayOfWeek === 0 ? 6 : currentDayOfWeek - 1],
                  timestamp: cell.dataset.date
                });
              }
            }
          }
        });
      }

      // Console log pentru săptămâna lucrătoare selectată
      console.log('🗓️ Săptămână lucrătoare selectată:', {
        tipSaptamana: this.currentWorkWeek,
        zileLucratoare: workingDaysSelected,
        totalZile: workingDaysSelected.length,
        perioada: `${workingDaysSelected[0]?.data} - ${workingDaysSelected[workingDaysSelected.length - 1]?.data}`
      });
    }
  }

  // Exemplu de utilizare:
  document.addEventListener('DOMContentLoaded', () => {
    // Varianta 1: Luni-Vineri (implicit)
    const calendar = new ConfigurableCalendar('monday-friday');

    // Varianta 2: Marți-Sâmbătă
    // const calendar = new ConfigurableCalendar('tuesday-saturday');

    // Expunem calendarul global pentru control din exterior
    window.calendar = calendar;

    // Exemplu de cum să schimbi configurația din exterior:
    // window.calendar.setWorkWeek('tuesday-saturday');
    // console.log(window.calendar.getWorkWeekType()); // 'tuesday-saturday'
  });
</script>
</body>
</html>
