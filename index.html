<!DOCTYPE html>
<html lang="ro">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Calendar cu Swipe Smooth</title>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      background: white;
      padding: 40px 20px;
      min-height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
    }

    .calendar-container {
      background: white;
      padding: 20px;
      max-width: 320px;
      width: 100%;
      border: 1px solid #e5e5e5;
      border-radius: 8px;
      position: relative;
      overflow: hidden;
      touch-action: pan-y;
    }

    .calendar-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 20px;
    }

    .month-year {
      font-size: 22px;
      font-weight: 600;
      color: #333;
    }

    .nav-buttons {
      display: flex;
      gap: 15px;
    }

    .nav-btn {
      background: none;
      border: none;
      width: 24px;
      height: 24px;
      display: flex;
      align-items: center;
      justify-content: center;
      cursor: pointer;
      font-size: 20px;
      color: #999;
    }

    .nav-btn:hover {
      color: #666;
    }

    /* Choc UI Carousel Styles */
    .calendar-carousel-wrapper {
      width: 100%;
      overflow: hidden;
      position: relative;
    }

    .calendar-carousel {
      display: flex;
      width: 100%;
      /* Transition și marginLeft vor fi setate dinamic */
    }

    .calendar-slide {
      width: 100%;
      flex: none;
    }

    .calendar-grid {
      display: grid;
      grid-template-columns: repeat(7, 1fr);
      gap: 0;
      width: 100%;
    }

    .day-header {
      text-align: center;
      font-weight: 500;
      color: #888;
      padding: 12px 4px;
      font-size: 14px;
      position: relative;
    }

    .day-header.current-day-header {
      color: #4a7c59;
      font-weight: 600;
    }

    .day-header.current-day-header::after {
      content: '';
      position: absolute;
      bottom: 8px;
      left: 50%;
      transform: translateX(-50%);
      width: 20px;
      height: 2px;
      background-color: #4a7c59;
      border-radius: 1px;
    }

    .day-cell {
      aspect-ratio: 1;
      display: flex;
      align-items: center;
      justify-content: center;
      cursor: pointer;
      font-size: 16px;
      font-weight: 400;
      background: white;
      color: #333;
      user-select: none;
    }

    .day-cell:hover {
      background: #f8f8f8;
    }

    .day-cell.working-day-active {
      background: #90c695;
      color: white;
      border-radius: 8px;
      margin: 2px;
    }

    .day-cell.working-day-active:hover {
      background: #7fb584;
    }

    .day-cell.current-day {
      background: #4a7c59 !important;
      color: white !important;
      font-weight: 600;
      border-radius: 8px;
      margin: 2px;
    }

    .day-cell.other-month {
      color: #ddd;
      background: white;
    }

    .day-cell.selected {
      background: #90c695 !important;
      color: white !important;
      border-radius: 8px;
      margin: 2px;
    }

    .day-cell.single-day-selected {
      background: #90c695 !important;
      color: white !important;
      border-radius: 8px;
      margin: 2px;
    }

    @media (max-width: 480px) {
      body {
        padding: 20px 10px;
      }

      .calendar-container {
        padding: 15px;
        margin: 10px;
        max-width: 300px;
      }

      .month-year {
        font-size: 20px;
      }

      .day-cell {
        font-size: 14px;
      }

      .nav-buttons {
        opacity: 0.3;
      }

      .nav-btn {
        font-size: 18px;
      }
    }

    @media (max-width: 360px) {
      .nav-buttons {
        display: none;
      }
    }
  </style>
</head>
<body>
<div class="calendar-container" id="calendarContainer">
  <div class="calendar-header">
    <div class="month-year" id="monthYear"></div>
    <div class="nav-buttons">
      <button class="nav-btn" id="prevBtn">‹</button>
      <button class="nav-btn" id="nextBtn">›</button>
    </div>
  </div>

  <div class="calendar-carousel-wrapper">
    <div class="calendar-carousel" id="calendarCarousel">
      <!-- Slide-urile vor fi generate dinamic -->
    </div>
  </div>
</div>

<script>
  class ChocUICalendar {
    constructor(workWeekType = 'tuesday-saturday') {
      this.currentDate = new Date();
      this.today = new Date();
      this.monthNames = [
        'Ianuarie', 'Februarie', 'Martie', 'Aprilie', 'Mai', 'Iunie',
        'Iulie', 'August', 'Septembrie', 'Octombrie', 'Noiembrie', 'Decembrie'
      ];
      this.dayNames = ['Lu', 'Ma', 'Mi', 'Jo', 'Vi', 'Sâ', 'Du'];

      this.workWeekConfigs = {
        'monday-friday': [1, 2, 3, 4, 5],
        'tuesday-saturday': [2, 3, 4, 5, 6]
      };

      this.setWorkWeek(workWeekType);

      // Exact ca în Choc UI React
      this.SLIDE_CHANGE_THRESHOLD = 100;
      this.currentSlide = 0;
      this.dragging = false;
      this.dragStartX = 0;
      this.dragOffset = 0;
      this.slides = [];

      this.init();
    }

    init() {
      this.generateSlides();
      this.render();
      this.attachEventListeners();
      this.initializeSwipeListeners();
    }

    setWorkWeek(workWeekType) {
      if (!this.workWeekConfigs[workWeekType]) {
        console.warn(`Tip săptămână lucrătoare necunoscut: ${workWeekType}. Se folosește 'tuesday-saturday'.`);
        workWeekType = 'tuesday-saturday';
      }

      this.currentWorkWeek = workWeekType;
      this.workingDays = this.workWeekConfigs[workWeekType];
    }

    generateSlides() {
      // Generează 12 luni pentru anul curent
      this.slides = [];
      for (let i = 0; i < 12; i++) {
        const monthDate = new Date(this.currentDate.getFullYear(), i, 1);
        this.slides.push(monthDate);
      }
      this.currentSlide = this.currentDate.getMonth();
    }

    attachEventListeners() {
      document.getElementById('prevBtn').addEventListener('click', () => {
        this.prevSlide();
      });

      document.getElementById('nextBtn').addEventListener('click', () => {
        this.nextSlide();
      });
    }

    initializeSwipeListeners() {
      const carousel = document.getElementById('calendarCarousel');

      // Exact ca în Choc UI - mouse events
      carousel.addEventListener('mousedown', this.handleMouseDown.bind(this));
      carousel.addEventListener('mousemove', this.handleMouseMove.bind(this));
      carousel.addEventListener('mouseup', this.handleMouseUp.bind(this));

      // Pentru wrapper ca în React
      const wrapper = carousel.parentElement;
      wrapper.addEventListener('mouseleave', this.handleMouseUp.bind(this));

      // Touch events
      carousel.addEventListener('touchstart', this.handleTouchStart.bind(this), { passive: true });
      carousel.addEventListener('touchmove', this.handleTouchMove.bind(this), { passive: false });
      carousel.addEventListener('touchend', this.handleTouchEnd.bind(this), { passive: true });
    }

    // Exact din Choc UI
    handleMouseDown(e) {
      this.dragging = true;
      this.dragStartX = e.clientX;
      e.preventDefault();
    }

    handleMouseMove(e) {
      if (this.dragging) {
        const diffX = e.clientX - this.dragStartX;
        this.dragOffset = diffX;
        this.updateCarouselStyle();
        e.preventDefault();
      }
    }

    handleMouseUp() {
      if (this.dragging) {
        this.dragging = false;
        if (Math.abs(this.dragOffset) > this.SLIDE_CHANGE_THRESHOLD) {
          const slideChange = this.dragOffset > 0 ? this.prevSlide.bind(this) : this.nextSlide.bind(this);
          slideChange();
        }
        this.dragOffset = 0;
        this.updateCarouselStyle();
      }
    }

    // Touch events
    handleTouchStart(e) {
      this.dragging = true;
      this.dragStartX = e.touches[0].clientX;
    }

    handleTouchMove(e) {
      if (this.dragging) {
        const diffX = e.touches[0].clientX - this.dragStartX;
        this.dragOffset = diffX;
        this.updateCarouselStyle();
        e.preventDefault();
      }
    }

    handleTouchEnd() {
      this.handleMouseUp();
    }

    // Logica exactă din Choc UI
    updateCarouselStyle() {
      const carousel = document.getElementById('calendarCarousel');
      const slidesCount = this.slides.length;

      // Do not move first slide to the right and last slide to the left
      let slideOffset = this.dragOffset;
      if (this.currentSlide === 0) {
        slideOffset = Math.min(this.dragOffset, 0);
      } else if (this.currentSlide === slidesCount - 1) {
        slideOffset = Math.max(this.dragOffset, 0);
      }

      // Exact formula din Choc UI: ml: `calc(-${currentSlide * 100}% + ${slideOffset}px)`
      const transition = this.dragging ? "none" : "all .5s";
      const marginLeft = `calc(-${this.currentSlide * 100}% + ${slideOffset}px)`;

      carousel.style.transition = transition;
      carousel.style.marginLeft = marginLeft;
      carousel.style.cursor = this.dragging ? "grabbing" : "grab";
    }

    prevSlide() {
      const slidesCount = this.slides.length;
      this.currentSlide = this.currentSlide === 0 ? slidesCount - 1 : this.currentSlide - 1;
      this.currentDate = new Date(this.slides[this.currentSlide]);
      this.updateCarouselStyle();
      this.renderHeader();
    }

    nextSlide() {
      const slidesCount = this.slides.length;
      this.currentSlide = this.currentSlide === slidesCount - 1 ? 0 : this.currentSlide + 1;
      this.currentDate = new Date(this.slides[this.currentSlide]);
      this.updateCarouselStyle();
      this.renderHeader();
    }

    isWorkingDay(dayOfWeek) {
      return this.workingDays.includes(dayOfWeek);
    }

    isToday(date) {
      return date.getDate() === this.today.getDate() &&
        date.getMonth() === this.today.getMonth() &&
        date.getFullYear() === this.today.getFullYear();
    }

    render() {
      this.renderHeader();
      this.renderCarousel();
    }

    renderHeader() {
      const monthYear = document.getElementById('monthYear');
      monthYear.textContent = `${this.monthNames[this.currentDate.getMonth()]} ${this.currentDate.getFullYear()}`;
    }

    renderCarousel() {
      const carousel = document.getElementById('calendarCarousel');
      carousel.innerHTML = '';

      // Renderează toate slide-urile (exact ca în React cu map)
      this.slides.forEach((slideDate, index) => {
        const slideElement = document.createElement('div');
        slideElement.className = 'calendar-slide';
        slideElement.setAttribute('key', `slide-${index}`);

        const grid = document.createElement('div');
        grid.className = 'calendar-grid';

        // TOATE slide-urile au headers și sunt interactive
        this.renderMonth(grid, slideDate, true);
        slideElement.appendChild(grid);
        carousel.appendChild(slideElement);
      });

      // Setează stilul inițial
      this.updateCarouselStyle();
    }

    renderMonth(calendarElement, monthDate, isPrimary) {
      calendarElement.innerHTML = '';

      // Day headers pentru TOATE slide-urile
      this.dayNames.forEach((day, index) => {
        const dayHeader = document.createElement('div');
        dayHeader.className = 'day-header';
        dayHeader.textContent = day;

        const todayDayOfWeek = this.today.getDay();
        const adjustedTodayDayOfWeek = todayDayOfWeek === 0 ? 6 : todayDayOfWeek - 1;
        if (index === adjustedTodayDayOfWeek) {
          dayHeader.classList.add('current-day-header');
        }

        calendarElement.appendChild(dayHeader);
      });

      const year = monthDate.getFullYear();
      const month = monthDate.getMonth();
      const firstDay = new Date(year, month, 1);

      let startingDayOfWeek = firstDay.getDay();
      startingDayOfWeek = startingDayOfWeek === 0 ? 6 : startingDayOfWeek - 1;

      // Previous month days
      const prevMonthLastDay = new Date(year, month, 0).getDate();
      for (let i = startingDayOfWeek - 1; i >= 0; i--) {
        const dayNum = prevMonthLastDay - i;
        const date = new Date(year, month - 1, dayNum);
        this.createDayCell(calendarElement, dayNum, date, true, isPrimary);
      }

      // Current month days
      const daysInMonth = new Date(year, month + 1, 0).getDate();
      for (let day = 1; day <= daysInMonth; day++) {
        const date = new Date(year, month, day);
        this.createDayCell(calendarElement, day, date, false, isPrimary);
      }

      // Next month days
      const totalCells = calendarElement.children.length - 7; // Întotdeauna 7 headers
      const remainingCells = 42 - totalCells;
      for (let day = 1; day <= remainingCells; day++) {
        const date = new Date(year, month + 1, day);
        this.createDayCell(calendarElement, day, date, true, isPrimary);
      }
    }

    createDayCell(calendarElement, dayNum, date, isOtherMonth, isPrimarySlide) {
      const dayCell = document.createElement('div');
      dayCell.className = 'day-cell';
      dayCell.textContent = dayNum;

      const dayOfWeek = date.getDay();
      dayCell.dataset.date = date.toISOString();
      dayCell.dataset.dayOfWeek = dayOfWeek;
      dayCell.dataset.isWorkingDay = this.isWorkingDay(dayOfWeek);

      if (isOtherMonth) {
        dayCell.classList.add('other-month');
      } else {
        if (this.isToday(date)) {
          dayCell.classList.add('current-day');
        }
      }

      // Event listener pentru TOATE zilele din luna curentă, nu doar slide-ul principal
      if (!isOtherMonth) {
        dayCell.addEventListener('click', () => {
          this.selectWorkingWeek(date);
        });
      }

      calendarElement.appendChild(dayCell);
    }

    clearAllSelections() {
      document.querySelectorAll('.day-cell').forEach(cell => {
        cell.classList.remove('selected', 'working-day-active', 'single-day-selected');
      });
    }

    selectWorkingWeek(selectedDate) {
      this.clearAllSelections();

      const selectedDay = new Date(selectedDate);
      const dayOfWeek = selectedDay.getDay();
      const mondayOffset = dayOfWeek === 0 ? -6 : 1 - dayOfWeek;
      const weekStart = new Date(selectedDay);
      weekStart.setDate(selectedDay.getDate() + mondayOffset);

      const workingDaysSelected = [];

      for (let i = 0; i < 7; i++) {
        const currentDay = new Date(weekStart);
        currentDay.setDate(weekStart.getDate() + i);
        const currentDayOfWeek = currentDay.getDay();

        // Caută în TOATE slide-urile, nu doar cel curent
        const cells = document.querySelectorAll('.day-cell');
        cells.forEach(cell => {
          if (cell.dataset.date) {
            const cellDate = new Date(cell.dataset.date);
            if (cellDate.getDate() === currentDay.getDate() &&
              cellDate.getMonth() === currentDay.getMonth() &&
              cellDate.getFullYear() === currentDay.getFullYear()) {

              // Colorează DOAR zilele lucrătoare, nu toate zilele săptămânii
              if (this.isWorkingDay(currentDayOfWeek) && !cell.classList.contains('other-month')) {
                cell.classList.add('working-day-active');
                workingDaysSelected.push({
                  data: cellDate.toLocaleDateString('ro-RO'),
                  ziSaptamana: this.dayNames[currentDayOfWeek === 0 ? 6 : currentDayOfWeek - 1],
                  timestamp: cell.dataset.date
                });
              }
            }
          }
        });
      }

      console.log('🗓️ Săptămână lucrătoare selectată:', {
        tipSaptamana: this.currentWorkWeek,
        zileLucratoare: workingDaysSelected,
        totalZile: workingDaysSelected.length,
        perioada: `${workingDaysSelected[0]?.data} - ${workingDaysSelected[workingDaysSelected.length - 1]?.data}`
      });
    }
  }

  // Initialize calendar
  document.addEventListener('DOMContentLoaded', () => {
    const calendar = new ChocUICalendar('tuesday-saturday');
    window.calendar = calendar;

    console.log('📱 Choc UI carousel style enabled!');
  });
</script>
</body>
</html>
