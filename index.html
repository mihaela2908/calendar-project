<!DOCTYPE html>
<html lang="ro">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Calendar cu Swipe Mobile</title>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      background: white;
      padding: 40px 20px;
      min-height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
    }

    .calendar-container {
      background: white;
      padding: 20px;
      max-width: 320px;
      width: 100%;
      border: 1px solid #e5e5e5;
      border-radius: 8px;
      position: relative;
      overflow: hidden;
      touch-action: pan-y;
    }

    .calendar-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 20px;
    }

    .month-year {
      font-size: 22px;
      font-weight: 600;
      color: #333;
    }

    .nav-buttons {
      display: flex;
      gap: 15px;
    }

    .nav-btn {
      background: none;
      border: none;
      width: 24px;
      height: 24px;
      display: flex;
      align-items: center;
      justify-content: center;
      cursor: pointer;
      font-size: 20px;
      color: #999;
    }

    .nav-btn:hover {
      color: #666;
    }

    .calendar-wrapper {
      position: relative;
      overflow: hidden;
      width: 100%;
    }

    .calendar-grid {
      display: grid;
      grid-template-columns: repeat(7, 1fr);
      gap: 0;
      transition: transform 0.25s ease-out;
      width: 100%;
    }

    .calendar-grid.transitioning {
      transition: none;
    }

    /* Container pentru multiple calendare */
    .calendar-months {
      display: flex;
      width: 300%;
      transform: translateX(-33.333%);
      transition: transform 0.25s ease-out;
    }

    .calendar-months.transitioning {
      transition: none;
    }

    .calendar-month {
      width: 33.333%;
      flex-shrink: 0;
    }

    .calendar-month .calendar-grid {
      width: 100%;
      transform: none;
      transition: none;
    }

    .day-header {
      text-align: center;
      font-weight: 500;
      color: #888;
      padding: 12px 4px;
      font-size: 14px;
      position: relative;
    }

    .day-header.current-day-header {
      color: #4a7c59;
      font-weight: 600;
    }

    .day-header.current-day-header::after {
      content: '';
      position: absolute;
      bottom: 8px;
      left: 50%;
      transform: translateX(-50%);
      width: 20px;
      height: 2px;
      background-color: #4a7c59;
      border-radius: 1px;
    }

    .day-cell {
      aspect-ratio: 1;
      display: flex;
      align-items: center;
      justify-content: center;
      cursor: pointer;
      font-size: 16px;
      font-weight: 400;
      background: white;
      color: #333;
      user-select: none;
    }

    .day-cell:hover {
      background: #f8f8f8;
    }

    .day-cell.working-day-active {
      background: #90c695;
      color: white;
      border-radius: 8px;
      margin: 2px;
    }

    .day-cell.working-day-active:hover {
      background: #7fb584;
    }

    .day-cell.current-day {
      background: #4a7c59 !important;
      color: white !important;
      font-weight: 600;
      border-radius: 8px;
      margin: 2px;
    }

    .day-cell.other-month {
      color: #ddd;
      background: white;
    }

    .day-cell.selected {
      background: #90c695 !important;
      color: white !important;
      border-radius: 8px;
      margin: 2px;
    }

    .day-cell.single-day-selected {
      background: #90c695 !important;
      color: white !important;
      border-radius: 8px;
      margin: 2px;
    }

    .swipe-indicator {
      position: absolute;
      top: 50%;
      transform: translateY(-50%);
      font-size: 24px;
      color: #4a7c59;
      opacity: 0;
      pointer-events: none;
      z-index: 10;
    }

    .swipe-indicator.left {
      left: 10px;
    }

    .swipe-indicator.right {
      right: 10px;
    }

    .swipe-indicator.show {
      opacity: 0.7;
    }

    @media (max-width: 480px) {
      body {
        padding: 20px 10px;
      }

      .calendar-container {
        padding: 15px;
        margin: 10px;
        max-width: 300px;
      }

      .month-year {
        font-size: 20px;
      }

      .day-cell {
        font-size: 14px;
      }

      .nav-buttons {
        opacity: 0.3;
      }

      .nav-btn {
        font-size: 18px;
      }
    }

    @media (max-width: 360px) {
      .nav-buttons {
        display: none;
      }
    }
  </style>
</head>
<body>
<div class="calendar-container" id="calendarContainer">
  <div class="swipe-indicator left" id="swipeLeft">‹</div>
  <div class="swipe-indicator right" id="swipeRight">›</div>

  <div class="calendar-header">
    <div class="month-year" id="monthYear"></div>
    <div class="nav-buttons">
      <button class="nav-btn" id="prevBtn">‹</button>
      <button class="nav-btn" id="nextBtn">›</button>
    </div>
  </div>

  <div class="calendar-wrapper">
    <div class="calendar-months" id="calendarMonths">
      <div class="calendar-month">
        <div class="calendar-grid" id="prevCalendar"></div>
      </div>
      <div class="calendar-month">
        <div class="calendar-grid" id="calendar"></div>
      </div>
      <div class="calendar-month">
        <div class="calendar-grid" id="nextCalendar"></div>
      </div>
    </div>
  </div>
</div>

<script>
  class SwipeCalendar {
    constructor(workWeekType = 'tuesday-saturday') {
      this.currentDate = new Date();
      this.today = new Date();
      this.monthNames = [
        'Ianuarie', 'Februarie', 'Martie', 'Aprilie', 'Mai', 'Iunie',
        'Iulie', 'August', 'Septembrie', 'Octombrie', 'Noiembrie', 'Decembrie'
      ];
      this.dayNames = ['Lu', 'Ma', 'Mi', 'Jo', 'Vi', 'Sâ', 'Du'];

      this.workWeekConfigs = {
        'monday-friday': [1, 2, 3, 4, 5],
        'tuesday-saturday': [2, 3, 4, 5, 6]
      };

      this.setWorkWeek(workWeekType);

      // Swipe properties
      this.touchStartX = 0;
      this.touchEndX = 0;
      this.touchStartY = 0;
      this.touchEndY = 0;
      this.minSwipeDistance = 50;
      this.maxVerticalDistance = 100;
      this.isDragging = false;
      this.currentTranslateX = -33.333; // Poziția centrală

      this.init();
    }

    init() {
      this.render();
      this.attachEventListeners();
      this.initializeSwipeListeners();
    }

    setWorkWeek(workWeekType) {
      if (!this.workWeekConfigs[workWeekType]) {
        console.warn(`Tip săptămână lucrătoare necunoscut: ${workWeekType}. Se folosește 'tuesday-saturday'.`);
        workWeekType = 'tuesday-saturday';
      }

      this.currentWorkWeek = workWeekType;
      this.workingDays = this.workWeekConfigs[workWeekType];

      if (document.getElementById('calendar')) {
        this.render();
      }
    }

    attachEventListeners() {
      document.getElementById('prevBtn').addEventListener('click', () => {
        this.changeMonth(-1);
      });

      document.getElementById('nextBtn').addEventListener('click', () => {
        this.changeMonth(1);
      });
    }

    initializeSwipeListeners() {
      const container = document.getElementById('calendarContainer');

      // Touch events
      container.addEventListener('touchstart', this.handleTouchStart.bind(this), { passive: true });
      container.addEventListener('touchmove', this.handleTouchMove.bind(this), { passive: false });
      container.addEventListener('touchend', this.handleTouchEnd.bind(this), { passive: true });

      // Mouse events pentru desktop (opțional)
      container.addEventListener('mousedown', this.handleMouseDown.bind(this));
      container.addEventListener('mousemove', this.handleMouseMove.bind(this));
      container.addEventListener('mouseup', this.handleMouseUp.bind(this));
      container.addEventListener('mouseleave', this.handleMouseUp.bind(this));
    }

    handleTouchStart(e) {
      this.touchStartX = e.touches[0].clientX;
      this.touchStartY = e.touches[0].clientY;
      this.touchStartTime = Date.now();
    }

    handleTouchMove(e) {
      const currentX = e.touches[0].clientX;
      const currentY = e.touches[0].clientY;
      const deltaX = currentX - this.touchStartX;
      const deltaY = Math.abs(currentY - this.touchStartY);

      // Dacă gestul este mai mult vertical decât horizontal, nu intervenim
      if (deltaY > this.maxVerticalDistance) return;

      // Prevenim scroll-ul horizontal al paginii
      if (Math.abs(deltaX) > 10) {
        e.preventDefault();
      }
    }

    handleTouchEnd(e) {
      this.touchEndX = e.changedTouches[0].clientX;
      this.touchEndY = e.changedTouches[0].clientY;

      this.handleSwipe();
    }

    // Mouse events pentru testare pe desktop
    handleMouseDown(e) {
      this.isMouseDown = true;
      this.touchStartX = e.clientX;
      this.touchStartY = e.clientY;
      this.touchStartTime = Date.now();
      this.isDragging = false;

      const calendarMonths = document.getElementById('calendarMonths');
      calendarMonths.classList.add('transitioning');
    }

    handleMouseMove(e) {
      if (!this.isMouseDown) return;

      const deltaX = e.clientX - this.touchStartX;
      const deltaY = Math.abs(e.clientY - this.touchStartY);

      if (deltaY > this.maxVerticalDistance) return;

      if (Math.abs(deltaX) > 10) {
        this.isDragging = true;
      }

      if (this.isDragging) {
        // Calculează procentajul de mișcare bazat pe lățimea containerului
        const containerWidth = document.getElementById('calendarContainer').offsetWidth;
        const movePercent = (deltaX / containerWidth) * 33.333;
        const newTranslateX = this.currentTranslateX + movePercent;

        // Limitează mișcarea
        const clampedTranslateX = Math.max(-66.666, Math.min(0, newTranslateX));

        const calendarMonths = document.getElementById('calendarMonths');
        calendarMonths.style.transform = `translateX(${clampedTranslateX}%)`;
      }
    }

    handleMouseUp(e) {
      if (!this.isMouseDown) return;

      this.isMouseDown = false;
      this.touchEndX = e.clientX;
      this.touchEndY = e.clientY;

      const calendarMonths = document.getElementById('calendarMonths');
      calendarMonths.classList.remove('transitioning');

      if (this.isDragging) {
        this.handleSwipe();
      }
    }

    showSwipeIndicator(deltaX) {
      const leftIndicator = document.getElementById('swipeLeft');
      const rightIndicator = document.getElementById('swipeRight');

      if (Math.abs(deltaX) > 20) {
        if (deltaX > 0) {
          leftIndicator.classList.add('show');
          rightIndicator.classList.remove('show');
        } else {
          rightIndicator.classList.add('show');
          leftIndicator.classList.remove('show');
        }
      } else {
        this.hideSwipeIndicators();
      }
    }

    hideSwipeIndicators() {
      document.getElementById('swipeLeft').classList.remove('show');
      document.getElementById('swipeRight').classList.remove('show');
    }

    handleSwipe() {
      const deltaX = this.touchEndX - this.touchStartX;
      const deltaY = Math.abs(this.touchEndY - this.touchStartY);
      const swipeTime = Date.now() - this.touchStartTime;

      const calendarMonths = document.getElementById('calendarMonths');

      // Verifică dacă este un swipe valid
      if (Math.abs(deltaX) > this.minSwipeDistance &&
        deltaY < this.maxVerticalDistance &&
        swipeTime < 500) {

        if (deltaX > 0) {
          // Swipe dreapta - luna anterioară
          this.currentTranslateX = 0;
          this.currentDate.setMonth(this.currentDate.getMonth() - 1);
        } else {
          // Swipe stânga - luna următoare
          this.currentTranslateX = -66.666;
          this.currentDate.setMonth(this.currentDate.getMonth() + 1);
        }

        calendarMonths.style.transform = `translateX(${this.currentTranslateX}%)`;

        setTimeout(() => {
          this.currentTranslateX = -33.333;
          this.render();
          calendarMonths.style.transform = `translateX(-33.333%)`;
        }, 250);

      } else {
        // Revine la poziția inițială dacă swipe-ul nu e valid
        calendarMonths.style.transform = `translateX(-33.333%)`;
      }

      this.isDragging = false;
    }

    changeMonth(direction) {
      // Schimbare instant pentru butoane
      this.currentDate.setMonth(this.currentDate.getMonth() + direction);
      this.render();
    }

    isWorkingDay(dayOfWeek) {
      return this.workingDays.includes(dayOfWeek);
    }

    isToday(date) {
      return date.getDate() === this.today.getDate() &&
        date.getMonth() === this.today.getMonth() &&
        date.getFullYear() === this.today.getFullYear();
    }

    render() {
      this.renderHeader();
      this.renderCurrentMonth();
      this.renderAdjacentMonths();
    }

    renderCurrentMonth() {
      this.renderCalendarMonth(document.getElementById('calendar'), this.currentDate);
    }

    renderAdjacentMonths() {
      // Luna anterioară
      const prevMonth = new Date(this.currentDate);
      prevMonth.setMonth(prevMonth.getMonth() - 1);
      this.renderCalendarMonth(document.getElementById('prevCalendar'), prevMonth);

      // Luna următoare
      const nextMonth = new Date(this.currentDate);
      nextMonth.setMonth(nextMonth.getMonth() + 1);
      this.renderCalendarMonth(document.getElementById('nextCalendar'), nextMonth);
    }

    renderHeader() {
      const monthYear = document.getElementById('monthYear');
      monthYear.textContent = `${this.monthNames[this.currentDate.getMonth()]} ${this.currentDate.getFullYear()}`;
    }

    renderCalendarMonth(calendarElement, dateForMonth) {
      calendarElement.innerHTML = '';

      // Day headers (doar pentru calendarul principal)
      if (calendarElement.id === 'calendar') {
        this.dayNames.forEach((day, index) => {
          const dayHeader = document.createElement('div');
          dayHeader.className = 'day-header';
          dayHeader.textContent = day;

          const todayDayOfWeek = this.today.getDay();
          const adjustedTodayDayOfWeek = todayDayOfWeek === 0 ? 6 : todayDayOfWeek - 1;
          if (index === adjustedTodayDayOfWeek) {
            dayHeader.classList.add('current-day-header');
          }

          calendarElement.appendChild(dayHeader);
        });
      }

      const year = dateForMonth.getFullYear();
      const month = dateForMonth.getMonth();
      const firstDay = new Date(year, month, 1);
      const lastDay = new Date(year, month + 1, 0);

      let startingDayOfWeek = firstDay.getDay();
      startingDayOfWeek = startingDayOfWeek === 0 ? 6 : startingDayOfWeek - 1;

      // Previous month days
      const prevMonthLastDay = new Date(year, month, 0).getDate();
      for (let i = startingDayOfWeek - 1; i >= 0; i--) {
        const dayNum = prevMonthLastDay - i;
        const date = new Date(year, month - 1, dayNum);
        this.createDayCell(calendarElement, dayNum, date, true);
      }

      // Current month days
      const daysInMonth = lastDay.getDate();
      for (let day = 1; day <= daysInMonth; day++) {
        const date = new Date(year, month, day);
        this.createDayCell(calendarElement, day, date, false);
      }

      // Next month days
      const totalCells = calendarElement.children.length - (calendarElement.id === 'calendar' ? 7 : 0);
      const remainingCells = 42 - totalCells;
      for (let day = 1; day <= remainingCells; day++) {
        const date = new Date(year, month + 1, day);
        this.createDayCell(calendarElement, day, date, true);
      }
    }

    createDayCell(calendarElement, dayNum, date, isOtherMonth) {
      const dayCell = document.createElement('div');
      dayCell.className = 'day-cell';
      dayCell.textContent = dayNum;

      const dayOfWeek = date.getDay();
      dayCell.dataset.date = date.toISOString();
      dayCell.dataset.dayOfWeek = dayOfWeek;
      dayCell.dataset.isWorkingDay = this.isWorkingDay(dayOfWeek);

      if (isOtherMonth) {
        dayCell.classList.add('other-month');
      } else {
        if (this.isToday(date)) {
          dayCell.classList.add('current-day');
        }
      }

      if (!isOtherMonth) {
        dayCell.addEventListener('click', () => {
          this.selectWorkingWeek(date);
        });
      }

      calendarElement.appendChild(dayCell);
    }

    clearAllSelections() {
      document.querySelectorAll('.day-cell').forEach(cell => {
        cell.classList.remove('selected', 'working-day-active', 'single-day-selected');
      });
    }

    selectWorkingWeek(selectedDate) {
      this.clearAllSelections();

      const selectedDay = new Date(selectedDate);
      const dayOfWeek = selectedDay.getDay();
      const mondayOffset = dayOfWeek === 0 ? -6 : 1 - dayOfWeek;
      const weekStart = new Date(selectedDay);
      weekStart.setDate(selectedDay.getDate() + mondayOffset);

      const workingDaysSelected = [];

      for (let i = 0; i < 7; i++) {
        const currentDay = new Date(weekStart);
        currentDay.setDate(weekStart.getDate() + i);
        const currentDayOfWeek = currentDay.getDay();

        const cells = document.querySelectorAll('.day-cell');
        cells.forEach(cell => {
          if (cell.dataset.date) {
            const cellDate = new Date(cell.dataset.date);
            if (cellDate.getDate() === currentDay.getDate() &&
              cellDate.getMonth() === currentDay.getMonth() &&
              cellDate.getFullYear() === currentDay.getFullYear()) {

              // Colorează DOAR zilele lucrătoare, nu toate zilele săptămânii
              if (this.isWorkingDay(currentDayOfWeek) && !cell.classList.contains('other-month')) {
                cell.classList.add('working-day-active');
                workingDaysSelected.push({
                  data: cellDate.toLocaleDateString('ro-RO'),
                  ziSaptamana: this.dayNames[currentDayOfWeek === 0 ? 6 : currentDayOfWeek - 1],
                  timestamp: cell.dataset.date
                });
              }
            }
          }
        });
      }

      console.log('🗓️ Săptămână lucrătoare selectată:', {
        tipSaptamana: this.currentWorkWeek,
        zileLucratoare: workingDaysSelected,
        totalZile: workingDaysSelected.length,
        perioada: `${workingDaysSelected[0]?.data} - ${workingDaysSelected[workingDaysSelected.length - 1]?.data}`
      });
    }
  }

  // Initialize calendar
  document.addEventListener('DOMContentLoaded', () => {
    const calendar = new SwipeCalendar('tuesday-saturday');
    window.calendar = calendar;

    // Afișează instrucțiuni pentru utilizator pe mobile
    if ('ontouchstart' in window) {
      console.log('📱 Swipe left/right pentru a naviga între luni!');
    }
  });
</script>
</body>
</html>
